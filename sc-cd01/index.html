<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SC-01 Live Map · Beaufort, Berkeley, Charleston, Colleton & Dorchester</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://unpkg.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{ --ink:#102033; --paper:#f6f1e6; --gold:#c4a35a; --gold2:#e0c27a; --cd1a:#1a9b94; --panel:#0d1b2a; --line:rgba(255,255,255,.12); }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#071018;color:var(--paper);font-family:"Source Sans 3",system-ui,sans-serif}
  #app{display:grid;grid-template-columns:380px 1fr;height:100%}
  aside{background:linear-gradient(180deg,#102033 0%,#0a1622 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header.brand{padding:22px 22px 14px;border-bottom:1px solid var(--line)}
  header.brand .kicker{letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700}
  header.brand h1{font-family:Fraunces,Georgia,serif;font-size:28px;line-height:1.15;margin:6px 0 8px;font-weight:700}
  header.brand p{margin:0;color:#c9d4de;font-size:13.5px;line-height:1.45}
  .controls{padding:14px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
  .search input{width:100%;background:#08141f;border:1px solid #2a3d52;color:var(--paper);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid #35506a;background:#10283c;color:#e8eef4;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#1a1408}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#d5dee6}
  .switch{width:40px;height:22px;border-radius:999px;background:#35506a;position:relative;cursor:pointer}
  .switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--cd1a)}
  .switch.on i{left:20px}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{background:#0b1c2b;border:1px solid #22384c;border-radius:10px;padding:8px 10px}
  .stat b{display:block;font-size:18px;font-family:Fraunces,serif;color:var(--gold2)}
  .stat span{font-size:11px;color:#9fb0c0;letter-spacing:.04em;text-transform:uppercase}
  #list{overflow:auto;flex:1;padding:8px 10px 20px}
  .item{border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
  .item:hover{background:#132536}
  .item.sel{background:#163044;border-color:#3d6a86}
  .dot{width:10px;height:10px;border-radius:50%}
  .item .nm{font-weight:600;font-size:13.5px}
  .item .meta{font-size:11.5px;color:#9fb0c0}
  .item .tag{font-size:11px;font-weight:700;color:var(--gold)}
  #map{height:100%;background:#0a1a24}
  .panel{position:absolute;right:16px;top:16px;width:340px;max-height:calc(100% - 32px);overflow:auto;z-index:500;background:rgba(13,27,42,.94);border:1px solid #2c4a63;border-radius:16px;padding:16px;display:none}
  .panel h2{font-family:Fraunces,serif;margin:0 0 4px;font-size:22px}
  .panel .sub{color:#b7c6d3;font-size:13px;margin-bottom:12px}
  .badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;margin-right:6px}
  .b1{background:#134f4c;color:#b6fff8}
  .b6{background:#5a3f24;color:#f3d7b0}
  .office{margin-top:12px;padding-top:10px;border-top:1px solid #2a4156}
  .office h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
  .cand{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0}
  .party{font-size:11px;font-weight:700}
  .R{color:#f0b4b4}.O{color:#cfcfcf}
  .close{position:absolute;right:10px;top:10px;background:transparent;border:0;color:#c9d4de;font-size:20px;cursor:pointer}
  @media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:46vh}.panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:42vh}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <header class="brand">
      <div class="kicker">November 3, 2026 · General election</div>
      <h1>CD-01 precinct map · unique colors</h1>
      <p>Beaufort, Berkeley, Charleston, Colleton, and Dorchester. Republicans plus nonpartisan school-board seats.</p>
    </header>
    <div class="controls">
      <div class="search"><input id="q" placeholder="Search precinct…" autocomplete="off"/></div>
      <div class="chips" id="chips"></div>
      <div class="toggle-row"><span>Show CD-06 precincts in these counties</span><div class="switch" id="show6"><i></i></div></div>
      <div class="stats"><div class="stat"><b id="nAll">0</b><span>Precincts</span></div><div class="stat"><b id="n1">0</b><span>CD-01</span></div><div class="stat"><b id="n6">0</b><span>CD-06</span></div></div>
    </div>
    <div id="list"></div>
  </aside>
  <div style="position:relative"><div id="map"></div><div class="panel" id="panel"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="mini.js"></script>
<script>
const HOUSE={15:[["Heather Bell Hickman","R"]],80:[["Kathy DuBeau Landing","R"]],92:[["Brandon Cox","R"]],94:[["Gil Gatch","R"]],97:[["Robby Robbins","R"]],98:[["Greg Ford","R"]],99:[["Jarrod Brooks","R"]],100:[["Sylleste Davis","R"]],101:[["Arnie Borowsky","R"]],102:[["Harriet Holman","R"]],108:[["Lee Hewitt","R"]],110:[["Tom Hartnett","R"]],112:[["Joe Bustos","R"]],114:[["Gary Brewer","R"]],115:[["Johnnie Garmon","R"]],116:[["James Teeple","R"]],117:[["Jordan Pace","R"]],118:[["Bill Herbkersman","R"]],119:[["Lee Edwards","R"]],120:[["Weston Newton","R"]],121:[["Shelley Gay Yuhas","R"]],122:[["Bill Hager","R"]],123:[["Jeff Bradley","R"]],124:[["Shannon Erickson","R"]]};
const STATEWIDE=[["Governor / Lt. Governor",[["Alan Wilson / Mike Reichenbach","R"]]], ["Attorney General",[["David M. Stumbo","R"]]], ["Secretary of State",[["Mark Hammond","R"]]], ["State Treasurer",[["Curtis Loftis Jr.","R"]]], ["Comptroller General",[["Mike Burkhold","R"]]], ["Supt. of Education",[["Ellen Weaver","R"]]], ["Ag. Commissioner",[["Cody Simpson","R"]]]];
const SENATE=[["Darline Graham","R"]];
const CD1=[["Jenny Costa Honeycutt","R"]];
const CD6=[["John Peterson","R"]];
const LOCAL={Beaufort:[["Sheriff",[["Doug Seifert","R"]]],["Auditor",[["David Cadd","R"]]],["Treasurer",[["Maria Walls","R"]]],["Probate Judge",[["Heather Galvin","R"]]],["County Council",[["David Bartholomew — District 2","R"],["Michael J.D. Andersen — District 4","R"],["Joshua Hower — District 5","R"],["Anna Maria Tabernik — District 6","R"],["Kraig Gordon — District 8","R"],["Mark Lawson — District 9","R"],["John Casey — District 10","R"],["Elizabeth Galloway — District 11","R"]]]],Berkeley:[["County Supervisor",[["Johnny Cribb","R"]]],["Sheriff",[["Duane Lewis","R"]]],["Clerk of Court",[["Leah Guerry Dupree","R"]]],["Coroner",[["Darnell Hartwell","R"]]],["Probate Judge",[["Tiffany Provence","R"]]],["Register of Deeds",[["Cindy Forte","R"]]]],Charleston:[["Probate Judge",[["Irv Condon","R"]]]],Colleton:[["Treasurer",[["Becky Steele Hill","R"]]],["Auditor",[["Jeffrey Slocum","R"]]],["Probate Judge",[["Ceth Utsey","R"]]],["County Council",[["Scott Biering — At-Large","R"],["Bubba Trippe — Western District","R"]]]],Dorchester:[["County Council",[["Joe Debney — District 2","R"],["Rita May Oliphant Ranck — District 3","R"],["Jennifer Kunda — District 7","R"]]]]};
const SCHOOL={Berkeley:[["Mac McQuillin — District 2","NP"],["Kathy Littleton — District 4","NP"],["Sally Wofford — District 6","NP"]],Charleston:[["Keith Grybowski — District 1","NP"],["Stuart Day — District 3","NP"],["Carlotta Bailey — District 5","NP"],["Leah Whatley — District 7","NP"],["Karen Luhrs — District 9","NP"]],Colleton:[["Sheri Stone — District 2","NP"],["Anna Bright — District 4","NP"],["Donna Lynn Carter Stroble — District 6","NP"],["Rachel Williams — District 6","NP"]]};
const MINI=window.MINI||{};
const NAME_DISTRICT={"Colleton|edisto beach":[1,116],"Colleton|green pond":[1,121]};
function normName(s){return String(s||"").toLowerCase().replace(/\./g,"").replace(/\s+/g," ").trim()}
function lookupDistrict(county,pcode,name){const pref=(CO[county]||"");const hit=MINI[pref+pcode]||MINI[pref+String(pcode).padStart(3,"0")];if(hit&&hit.length)return hit;const named=NAME_DISTRICT[county+"|"+normName(name)];if(named)return named;if(county==="Beaufort")return [1,""];if(county==="Colleton")return [6,""];return ["",""]}
const CO={Beaufort:"F",Berkeley:"B",Charleston:"C",Colleton:"L",Dorchester:"D"};
let feats=[], countyFilter="All", show6=false, selected=null, layer;
const map=L.map("map",{zoomControl:true,minZoom:8}).setView([32.7,-80.35],9);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{attribution:"© OSM © CARTO",subdomains:"abcd",maxZoom:19}).addTo(map);
const COLOR_BY_KEY={};
function precinctKey(p){return (p.county||"")+"|"+(p.pcode||"")+"|"+(p.precinct||"")}
function assignUniqueColors(list){const sorted=[...list].sort((a,b)=>(a.properties.county+a.properties.precinct).localeCompare(b.properties.county+b.properties.precinct));sorted.forEach((f,i)=>{const p=f.properties;COLOR_BY_KEY[precinctKey(p)]="hsl("+((i*137.508)%360).toFixed(1)+", "+(p.cd==="6"?48:72)+"%, "+(38+(i%7)*3)+"%)"})}
function fillFor(p){return COLOR_BY_KEY[precinctKey(p)]||"hsl(180,60%,42%)"}
function styleFeat(f){const p=f.properties;const sel=selected&&selected.properties.precinct===p.precinct&&selected.properties.county===p.county;return {color:sel?"#fff":"#000",weight:sel?3.6:2.4,opacity:1,fillColor:fillFor(p),fillOpacity:sel?0.9:0.78}}
function visible(){const q=document.getElementById("q").value.trim().toLowerCase();return feats.filter(f=>{const p=f.properties;if(countyFilter!=="All"&&p.county!==countyFilter)return false;if(!show6&&p.cd!=="1")return false;if(q&&!(p.precinct||"").toLowerCase().includes(q))return false;return true})}
function onlyR(list){return (list||[]).filter(([n,p])=>p==="R")}
function candRows(list){const rows=onlyR(list);if(!rows.length)return `<div class="cand"><span>No Republican on this ballot line</span><span class="party O">—</span></div>`;return rows.map(([n,p])=>`<div class="cand"><span>${n}</span><span class="party ${p}">${p}</span></div>`).join("")}
function schoolRows(list){return (list||[]).map(([n])=>`<div class="cand"><span>${n}</span><span class="party O">NP</span></div>`).join("")}
function openPanel(f){selected=f;const p=f.properties;const houseCands=HOUSE[p.house]||[];const us=p.cd==="1"?CD1:CD6;const loc=LOCAL[p.county]||[];document.getElementById("panel").style.display="block";document.getElementById("panel").innerHTML=`<button class="close" id="x">×</button><span class="badge ${p.cd==="1"?"b1":"b6"}">U.S. House CD-${p.cd}</span><span class="badge b1">SC House ${p.house||"—"}</span><h2>${p.precinct}</h2><div class="sub">${p.county} County · precinct ${p.pcode||""}</div><div class="office"><h3>U.S. Senate</h3>${candRows(SENATE)}</div><div class="office"><h3>U.S. House, District ${p.cd}</h3>${candRows(us)}</div>${STATEWIDE.map(([o,cs])=>`<div class="office"><h3>${o}</h3>${candRows(cs)}</div>`).join("")}<div class="office"><h3>SC House District ${p.house||""}</h3>${candRows(houseCands)}</div>${loc.map(([o,cs])=>`<div class="office"><h3>${o}</h3>${candRows(cs)}</div>`).join("")}${SCHOOL[p.county]?`<div class="office"><h3>${p.county} County School Board</h3>${schoolRows(SCHOOL[p.county])}<div class="sub">Nonpartisan. Only the district covering this precinct appears on the ballot.</div></div>`:""}`;
document.getElementById("x").onclick=()=>{selected=null;document.getElementById("panel").style.display="none";redraw()};redraw()}
function redraw(){if(feats.length&&!Object.keys(COLOR_BY_KEY).length)assignUniqueColors(feats);const vis=visible();document.getElementById("nAll").textContent=vis.length;document.getElementById("n1").textContent=vis.filter(f=>f.properties.cd==="1").length;document.getElementById("n6").textContent=vis.filter(f=>f.properties.cd==="6").length;if(layer)map.removeLayer(layer);layer=L.geoJSON({type:"FeatureCollection",features:vis},{style:styleFeat,onEachFeature:(f,l)=>{l.on("click",()=>openPanel(f));l.bindTooltip(f.properties.precinct+" · CD-"+f.properties.cd,{sticky:true})}}).addTo(map);const list=document.getElementById("list");const sorted=[...vis].sort((a,b)=>(a.properties.county+a.properties.precinct).localeCompare(b.properties.county+b.properties.precinct));list.innerHTML=sorted.map(f=>{const p=f.properties;return `<div class="item" data-c="${p.county}" data-p="${p.precinct}"><span class="dot" style="background:${fillFor(p)}"></span><div><div class="nm">${p.precinct}</div><div class="meta">${p.county} · HD ${p.house||"—"}</div></div><div class="tag">CD-${p.cd}</div></div>`}).join("");list.querySelectorAll(".item").forEach(el=>{el.onclick=()=>{const f=feats.find(x=>x.properties.county===el.dataset.c&&x.properties.precinct===el.dataset.p);if(f)openPanel(f)}})}
const counties=["All","Beaufort","Berkeley","Charleston","Colleton","Dorchester"];const chips=document.getElementById("chips");counties.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c==="All"?" on":"");b.textContent=c;b.onclick=()=>{countyFilter=c;[...chips.children].forEach(x=>x.classList.toggle("on",x.textContent===c));redraw()};chips.appendChild(b)});
document.getElementById("show6").onclick=function(){show6=!show6;this.classList.toggle("on",show6);redraw()};
document.getElementById("q").addEventListener("input",redraw);
async function loadShapes(){const url="https://gis.charleston-sc.gov/arcgis2/rest/services/External/VotingDistricts/MapServer/9/query?where="+encodeURIComponent("CountyName IN ('Beaufort','Berkeley','Charleston','Colleton','Dorchester')")+"&outFields=PName,PCode,CountyName,Name&f=geojson&outSR=4326&resultRecordCount=2000";try{const gj=await fetch(url).then(r=>r.json());feats=(gj.features||[]).map(f=>{const a=f.properties||{};const county=a.CountyName||"";const name=a.PName||a.Name||"";const pcode=String(a.PCode||"");const hit=lookupDistrict(county,pcode,name);f.properties={county,precinct:name,pcode,cd:hit[0]!=null?String(hit[0]):"",house:hit[1]!=null?hit[1]:""};return f}).filter(f=>f.geometry);assignUniqueColors(feats)}catch(e){feats=[]}redraw();if(layer)map.fitBounds(layer.getBounds(),{padding:[20,20]})}
loadShapes();
</script>
</body>
</html>
