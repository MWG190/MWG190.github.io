<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SC-01 Live Map · Berkeley, Charleston &amp; Dorchester</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{height:100%;margin:0;background:#071018;color:#f6f1e6;font-family:system-ui,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
aside{background:#102033;border-right:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;min-height:0}
header{padding:18px;border-bottom:1px solid rgba(255,255,255,.12)}
.kicker{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#c4a35a;font-weight:700}
h1{font-size:26px;margin:6px 0 8px}
header p{margin:0;color:#c9d4de;font-size:13px;line-height:1.45}
.controls{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(255,255,255,.12)}
input{width:100%;background:#08141f;border:1px solid #2a3d52;color:#f6f1e6;border-radius:10px;padding:10px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #35506a;background:#10283c;color:#e8eef4;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
.chip.on{background:#c4a35a;border-color:#c4a35a;color:#1a1408}
.toggle{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#0b1c2b;border:1px solid #22384c;border-radius:10px;padding:8px}
.stat b{display:block;font-size:18px;color:#e0c27a}
.stat span{font-size:11px;color:#9fb0c0;text-transform:uppercase}
#list{overflow:auto;flex:1;padding:8px}
.item{border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.item:hover,.item.sel{background:#163044}
.dot{width:10px;height:10px;border-radius:50%}
.cd1{background:#1a9b94}.cd6{background:#c4a07a}
.meta{font-size:12px;color:#9fb0c0}
#map{height:100%;background:#0a1a24}
.panel{position:absolute;right:16px;top:16px;width:340px;max-height:calc(100% - 32px);overflow:auto;z-index:500;background:rgba(13,27,42,.94);border:1px solid #2c4a63;border-radius:16px;padding:16px;display:none}
.office{margin-top:12px;padding-top:10px;border-top:1px solid #2a4156}
.office h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c4a35a}
.cand{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.R{color:#f0b4b4}.D{color:#b7d4ff}.L{color:#e7d48a}.O{color:#cfcfcf}
.close{position:absolute;right:10px;top:10px;background:transparent;border:0;color:#c9d4de;font-size:20px;cursor:pointer}
.legend{position:absolute;left:16px;bottom:24px;z-index:500;background:rgba(13,27,42,.92);border:1px solid #2c4a63;border-radius:12px;padding:10px 12px;font-size:12px}
@media(max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:46vh}.panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:42vh}}
</style>
</head>
<body>
<div id="app">
<aside>
<header>
<div class="kicker">November 3, 2026 · General election</div>
<h1>CD-01 precinct map</h1>
<p>Berkeley, Charleston, and Dorchester. Click a precinct for the names on that ballot.</p>
</header>
<div class="controls">
<input id="q" placeholder="Search precinct…" autocomplete="off"/>
<div class="chips" id="chips"></div>
<div class="toggle"><span>Show CD-06 precincts</span><button class="chip" id="show6">Off</button></div>
<div class="stats">
<div class="stat"><b id="nAll">0</b><span>Precincts</span></div>
<div class="stat"><b id="n1">0</b><span>CD-01</span></div>
<div class="stat"><b id="n6">0</b><span>CD-06</span></div>
</div>
</div>
<div id="list"></div>
</aside>
<div style="position:relative">
<div id="map"></div>
<div class="panel" id="panel"></div>
<div class="legend">Teal = U.S. House 1 · Tan = U.S. House 6<br/>Not a certified sample ballot — confirm at scvotes.gov</div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="mini.js"></script>
<script>
const HOUSE={15:[["Heather Bell Hickman","R"],["J.A. Moore","D"]],80:[["Kathy DuBeau Landing","R"],["Benjamin Brown","D"]],90:[["See sample ballot","O"]],92:[["Brandon Cox","R"],["Byron Walters","D"]],94:[["Gil Gatch","R"],["Sally Hebert","D"]],95:[["See sample ballot","R"],["Gilda Cobb-Hunter","D"]],97:[["Robby Robbins","R"],["Cathy A. Jaggars","D"]],98:[["Greg Ford","R"],["Sonja Ogletree Satani","D"]],99:[["Jarrod Brooks","R"],["Samuel Price","D"]],100:[["Sylleste Davis","R"],["Crystal Campbell","D"]],101:[["Arnie Borowsky","R"],["Roger Kirby","D"]],102:[["Harriet Holman","R"],["Montez Aiken","D"]],103:[["No Republican nominee","O"],["Carl Anderson","D"]],108:[["Lee Hewitt","R"],["Kathy Redwine","D"]],109:[["See sample ballot","O"],["Tiffany Spann-Wilder","D"]],110:[["Tom Hartnett","R"],["KJ Atwood","D"]],111:[["See sample ballot","O"],["Wendell Gilliard","D"]],112:[["Joe Bustos","R"],["Jenna Arsenault","D"]],113:[["See sample ballot","O"],["Courtney Waters","D"]],114:[["Gary Brewer","R"],["Kelly Hough","D"]],115:[["Johnnie Garmon","R"],["Nick Uricchio","D"]],116:[["James Teeple","R"],["Clay Middleton","D"]],117:[["Jordan Pace","R"],["Ashley Painter","D"]],119:[["Lee Edwards","R"],["Leon Stavrinakis","D"]]};
const STATEWIDE=[["Governor / Lt. Governor",[["Alan Wilson / Mike Reichenbach","R"],["Jermaine Johnson","D"]]],["Attorney General",[["David M. Stumbo","R"],["Richard Hricik","D"]]],["Secretary of State",[["Mark Hammond","R"],["Jason Belton","D"]]],["State Treasurer",[["Curtis Loftis Jr.","R"],["Vincent Coe","D"]]],["Comptroller General",[["Mike Burkhold","R"],["Tiffany Boozer","D"]]],["Supt. of Education",[["Ellen Weaver","R"],["Sylvia Wright","D"]]],["Ag. Commissioner",[["Cody Simpson","R"],["DeShawn Blanding","D"]]]];
const SENATE=[["Darline Graham","R"],["Annie Andrews","D"],["Kasie Whitener","L"],["Mark Hackett","Con"]];
const CD1=[["Jenny Costa Honeycutt","R"],["Nancy Lacore","D"],["Bill Reeside","L"]];
const CD6=[["John Peterson","R"],["Jim Clyburn","D"]];
const LOCAL={Berkeley:[["County Supervisor",[["Johnny Cribb","R"]]],["Sheriff",[["Duane Lewis","R"]]],["Clerk of Court",[["Leah Guerry Dupree","R"]]],["Coroner",[["Darnell Hartwell","R"]]],["Probate Judge",[["Tiffany Provence","R"]]],["Register of Deeds",[["Cindy Forte","R"]]]],Charleston:[["Probate Judge",[["Irv Condon","R"],["Tamara Cunningham Curry","D"]]],["Register of Deeds",[["Karen Lesser Hollings","D"]]]],Dorchester:[["County Council (if your district is on the ballot)",[["D2 Joe Debney (R) vs Bryan Holman (D)","O"],["D3 Rita May Oliphant Ranck (R) vs Jessica Bright (D)","O"],["D7 Jennifer Kunda (R) vs Preston Smelt (D)","O"]]]]};
const MINI=window.MINI||{};
const CO={Berkeley:"B",Charleston:"C",Dorchester:"D"};
let feats=[], countyFilter="All", show6=false, selected=null, layer;
const map=L.map("map",{zoomControl:true,minZoom:8}).setView([33.0,-80.05],10);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{attribution:"OSM · CARTO · SC RFA",subdomains:"abcd",maxZoom:19}).addTo(map);
function styleFeat(f){const cd=f.properties.cd;const sel=selected&&selected.properties.precinct===f.properties.precinct&&selected.properties.county===f.properties.county;return cd==="1"?{color:sel?"#fff":"#0b3d3a",weight:sel?2.4:.7,fillColor:"#1a9b94",fillOpacity:sel?.72:.48}:{color:sel?"#fff":"#5a3f24",weight:sel?2.4:.6,fillColor:"#c4a07a",fillOpacity:sel?.55:.28};}
function visible(){const q=document.getElementById("q").value.trim().toLowerCase();return feats.filter(f=>{const p=f.properties;if(countyFilter!=="All"&&p.county!==countyFilter)return false;if(!show6&&p.cd!=="1")return false;if(q&&!(p.precinct||"").toLowerCase().includes(q)&&String(p.house||"").indexOf(q)<0)return false;return true;});}
function candRows(list){return list.map(([n,p])=>`<div class="cand"><span>${n}</span><span class="${p}">${p}</span></div>`).join("");}
function openPanel(f){selected=f;const p=f.properties;const houseCands=HOUSE[p.house]||[["See sample ballot","O"]];const us=p.cd==="1"?CD1:CD6;const loc=LOCAL[p.county]||[];const panel=document.getElementById("panel");panel.style.display="block";panel.innerHTML=`<button class="close" id="x">×</button><h2>${p.precinct}</h2><div class="meta">${p.county} · CD-${p.cd} · HD ${p.house||"—"} · precinct ${p.pcode||""}</div><div class="office"><h3>U.S. Senate</h3>${candRows(SENATE)}</div><div class="office"><h3>U.S. House, District ${p.cd}</h3>${candRows(us)}</div>${STATEWIDE.map(([o,cs])=>`<div class="office"><h3>${o}</h3>${candRows(cs)}</div>`).join("")}<div class="office"><h3>SC House District ${p.house||""}</h3>${candRows(houseCands)}</div>${loc.map(([o,cs])=>`<div class="office"><h3>${o}</h3>${candRows(cs)}</div>`).join("")}<div class="office"><h3>Note</h3><div class="meta">County council and school-board seats are districted. Confirm the exact local line on scvotes.gov. SC Senate is not on the 2026 ballot.</div></div>`;document.getElementById("x").onclick=()=>{selected=null;panel.style.display="none";redraw();};if(layer){layer.eachLayer(l=>{if(l.feature&&l.feature.properties.precinct===p.precinct&&l.feature.properties.county===p.county)map.fitBounds(l.getBounds(),{padding:[40,40],maxZoom:13});});}redraw();}
function redraw(){const vis=visible();document.getElementById("nAll").textContent=vis.length;document.getElementById("n1").textContent=vis.filter(f=>f.properties.cd==="1").length;document.getElementById("n6").textContent=vis.filter(f=>f.properties.cd==="6").length;if(layer)map.removeLayer(layer);layer=L.geoJSON({type:"FeatureCollection",features:vis.filter(f=>f.geometry)},{style:styleFeat,onEachFeature:(f,l)=>{l.on("click",()=>openPanel(f));l.bindTooltip(`${f.properties.precinct} · CD-${f.properties.cd} · HD ${f.properties.house||"—"}`,{sticky:true,opacity:.92});}}).addTo(map);const list=document.getElementById("list");const sorted=[...vis].sort((a,b)=>(a.properties.county+a.properties.precinct).localeCompare(b.properties.county+b.properties.precinct));list.innerHTML=sorted.map(f=>{const p=f.properties;const sel=selected&&selected.properties.precinct===p.precinct&&selected.properties.county===p.county;return `<div class="item ${sel?"sel":""}" data-c="${p.county}" data-p="${p.precinct}"><span class="dot ${p.cd==="1"?"cd1":"cd6"}"></span><div><div>${p.precinct}</div><div class="meta">${p.county} · HD ${p.house||"—"}</div></div><div class="meta">CD-${p.cd}</div></div>`;}).join("");list.querySelectorAll(".item").forEach(el=>{el.onclick=()=>{const f=feats.find(x=>x.properties.county===el.dataset.c&&x.properties.precinct===el.dataset.p);if(f)openPanel(f);};});}
const chips=document.getElementById("chips");["All","Berkeley","Charleston","Dorchester"].forEach(c=>{const b=document.createElement("button");b.className="chip"+(c==="All"?" on":"");b.textContent=c;b.onclick=()=>{countyFilter=c;[...chips.children].forEach(x=>x.classList.toggle("on",x.textContent===c));redraw();};chips.appendChild(b);});document.getElementById("show6").onclick=function(){show6=!show6;this.textContent=show6?"On":"Off";this.classList.toggle("on",show6);redraw();};
document.getElementById("q").addEventListener("input",redraw);
async function loadShapes(){const url="https://gis.charleston-sc.gov/arcgis2/rest/services/External/VotingDistricts/MapServer/9/query?where="+encodeURIComponent("CountyName IN ('Berkeley','Charleston','Dorchester')")+"&outFields=PName,PCode,CountyName,Name&f=geojson&outSR=4326&resultRecordCount=2000";try{const gj=await fetch(url).then(r=>r.json());feats=(gj.features||[]).map(f=>{const a=f.properties||{};const county=a.CountyName||"";const name=a.PName||a.Name||"";const pcode=String(a.PCode||"");const hit=MINI[(CO[county]||"")+pcode]||MINI[(CO[county]||"")+pcode.padStart(3,"0")]||[];f.properties={county,precinct:name,pcode,cd:hit[0]!=null?String(hit[0]):"",house:hit[1]!=null?hit[1]:""};return f;}).filter(f=>f.geometry);}catch(e){console.error(e);feats=[];}redraw();if(layer)map.fitBounds(layer.getBounds(),{padding:[20,20]});}
loadShapes();
</script>
</body>
</html>
