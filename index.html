<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MWG190 maps</title>
<style>
body{margin:0;font-family:Georgia,serif;background:#0d1b2a;color:#f6f1e6;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{max-width:560px;padding:32px}
h1{font-size:34px;margin:0 0 12px}
a{color:#e0c27a}
.card{display:block;margin-top:18px;padding:16px 18px;border:1px solid #2c4a63;border-radius:14px;text-decoration:none;color:inherit}
.card:hover{border-color:#e0c27a}
.kicker{color:#c4a35a;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-family:sans-serif}
</style>
</head>
<body>
<main>
  <div class="kicker">Live election maps</div>
  <h1>MWG190 maps</h1>
  <a class="card" href="./sc-cd01/">
    <div class="kicker">South Carolina · Nov 3, 2026</div>
    <strong>CD-01 precinct ballot map</strong>
    <div>Berkeley, Charleston, and Dorchester precincts</div>
  </a>
  <a class="card" href="https://mwg190.github.io/northshore-vote-map/">
    <div class="kicker">Louisiana</div>
    <strong>Northshore vote map</strong>
    <div>St. Tammany and Washington Parishes</div>
  </a>
</main>
</body>
</html>
